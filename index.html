<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 관찰 일지</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#036242',
                            hover: '#024e35',
                        },
                        background: '#f8fafc', // bg-slate-50
                        textMain: '#0f172a',    // text-slate-900
                        textMuted: '#64748b'    // text-slate-600
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', '"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- 폰트 추가 (Noto Sans KR 및 구글 로그인 버튼용 Roboto) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* 공통 애니메이션 유틸리티 */
        .fade-in {
            animation: fadeIn 0.2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .btn-ripple:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col antialiased">



    <!-- 상단 헤더 (sticky) -->
    <header class="sticky top-0 z-40 w-full bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 및 제목 -->
                <div class="flex items-center gap-2">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg>
                    <h1 class="text-xl font-bold text-slate-900">학급 관찰 일지</h1>
                </div>

                <!-- 로그인 전/후 상태에 따른 우측 영역 (JS로 전환) -->
                <div id="header-auth-section" class="flex items-center">
                    <!-- Placeholder: 구글로 로그인 버튼 또는 사용자 정보 -->
                </div>
            </div>
        </div>
    </header>

    <div class="flex-grow flex flex-col md:flex-row max-w-7xl mx-auto w-full">
        <!-- 사이드바 (PC에서는 좌측, 모바일/태블릿에서는 하단 네비게이션 형태이나, 마크업 구조상 분리) -->
        <!-- 여기서는 반응형 구조를 고려하여 PC 사이드바와 하단 네비를 위한 컨테이너 정의 -->
        <aside
            class="hidden lg:block w-64 flex-shrink-0 bg-white border-r border-slate-200 min-h-[calc(100vh-4rem)] p-4">
            <nav class="space-y-1">
                <a href="#"

                    <svg class="text-primary mr-3 flex-shrink-0 h-6 w-6" fill="none" stroke="currentColor"

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </svg>

                <a href="#"

                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                    <span class="truncate">통계 / 분석</span>
                </a>
                <a href="#"
                    class="text-slate-600 hover:bg-slate-50 hover:text-slate-900 group flex items-center px-3 py-2 text-sm font-medium rounded-md">
                    <svg class="text-slate-400 group-hover:text-slate-500 mr-3 flex-shrink-0 h-6 w-6" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="truncate">설정</span>
                </a>
                <button type="button" onclick="openInitialCheckModal()"

                    <svg class="text-slate-400 group-hover:text-primary mr-3 flex-shrink-0 h-6 w-6" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                        </path>
                    </svg>
                    <span class="truncate">학기초 조사</span>
                </button>
            </nav>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8" id="main-content">
            <!-- 로그인 전 화면 예시 (기본은 숨김 처리) -->
            <div id="login-view" class="hidden flex flex-col items-center justify-center h-full min-h-[50vh]">
                <svg class="w-16 h-16 text-primary mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">학급 관찰 일지 시스템</h2>
                <p class="text-slate-600 mb-8 text-center max-w-md">선생님의 수업 직후 1~2분 관찰 기록이 아이들의 성장을 돕습니다.<br>학생들의 태그와
                    메모를 간편하게 관리하세요.</p>
                <button id="btn-login-main"
                    class="btn-ripple flex items-center justify-center px-4 py-2 border border-[#dadce0] text-sm rounded text-[#3c4043] bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 shadow-sm transition-colors"
                    style="font-family: 'Roboto', sans-serif; font-weight: 500;">
                    <!-- Google SVG Logo -->
                    <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                        </path>
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                        </path>
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                        </path>
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                        </path>
                        <path fill="none" d="M0 0h48v48H0z"></path>
                    </svg>
                    Google 계정으로 로그인
                </button>
            </div>

            <!-- 로그인 후 메인 (학생 목록 뷰) 예시 (기본 표시) -->
            <div id="dashboard-view" class="block fade-in">
                <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <!-- 검색창 -->
                    <div class="relative w-full sm:w-72">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <input type="text" id="search-student"
                            class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-md leading-5 bg-white placeholder-slate-500 focus:outline-none focus:placeholder-slate-400 focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-colors"
                            placeholder="학생 이름 검색">
                    </div>
                    <!-- 필터 버튼 -->
                    <div class="flex flex-wrap gap-2 text-sm">
                        <button
                            class="px-3 py-1.5 rounded-full bg-slate-900 text-white font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 filter-btn"
                            data-filter="all">전체 (0)</button>
                        <button
                            class="px-3 py-1.5 rounded-full bg-white text-slate-700 border border-slate-300 font-medium hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary filter-btn transition-colors"
                            data-filter="completed">성향완료 (0)</button>
                        <button
                            class="px-3 py-1.5 rounded-full bg-white text-amber-700 border border-amber-200 font-medium hover:bg-amber-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 filter-btn transition-colors"
                            data-filter="warning">주의필요 (0)</button>
                    </div>
                </div>

                <!-- 학생 카드 그리드 -->
                <div id="student-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-10 text-slate-500">
                        데이터를 불러오는 중입니다...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 하단 네비게이션 (모바일 전용) -->

        <div class="flex justify-around">
            <a href="#" class="flex flex-col items-center py-2 px-3 text-primary">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <span class="text-xs mt-1 font-medium">학생</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 text-slate-500 hover:text-slate-900">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                    </path>
                </svg>
                <span class="text-xs mt-1 font-medium">통계</span>
            </a>
            <a href="#" class="flex flex-col items-center py-2 px-3 text-slate-500 hover:text-slate-900">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-xs mt-1 font-medium">설정</span>
            </a>
        </div>
    </nav>

    <!-- 우측 하단 플로팅 버튼 (성향 체크) -->
    <button
        class="fixed right-4 bottom-20 lg:bottom-8 z-50 bg-primary hover:bg-primary-hover text-white rounded-full p-4 shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary btn-ripple transform transition-transform"
        aria-label="학기초 성향 체크">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
            </path>
        </svg>
    </button>

    <!-- 모달 백드롭 (공통) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden transition-opacity"></div>

    <!-- 태그 찍기 모달 -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
        <div class="flex min-h-screen items-center justify-center px-4 pt-4 pb-20 text-center sm:p-0">
            <div
                class="relative bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start w-full">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-slate-900 mb-4" id="tag-modal-title">태그 찍기
                            </h3>
                            <input type="hidden" id="tag-target-student-id">

                            <!-- 성격 카테고리 -->
                            <div class="mb-4">
                                <h4 class="text-sm font-medium text-slate-500 mb-2">성격</h4>
                                <div class="flex flex-wrap gap-2" id="tag-group-personality">
                                    <button
                                        class="tag-btn px-3 py-1 border border-sky-200 bg-sky-50 text-sky-700 rounded-full text-sm hover:bg-sky-100 transition-colors"
                                        data-category="personality" data-label="외향적" data-warning="">외향적</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-sky-200 bg-sky-50 text-sky-700 rounded-full text-sm hover:bg-sky-100 transition-colors"
                                        data-category="personality" data-label="내향적" data-warning="">내향적</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-sky-200 bg-sky-50 text-sky-700 rounded-full text-sm hover:bg-sky-100 transition-colors"
                                        data-category="personality" data-label="리더십" data-warning="">리더십</button>
                                </div>
                            </div>

                            <!-- 학습태도 카테고리 -->
                            <div class="mb-4">
                                <h4 class="text-sm font-medium text-slate-500 mb-2">학습태도</h4>
                                <div class="flex flex-wrap gap-2" id="tag-group-learning">
                                    <button
                                        class="tag-btn px-3 py-1 border border-indigo-200 bg-indigo-50 text-indigo-700 rounded-full text-sm hover:bg-indigo-100 transition-colors"
                                        data-category="learning" data-label="발표선호" data-warning="">발표선호</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-indigo-200 bg-indigo-50 text-indigo-700 rounded-full text-sm hover:bg-indigo-100 transition-colors"
                                        data-category="learning" data-label="경청함" data-warning="">경청함</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-indigo-200 bg-indigo-50 text-indigo-700 rounded-full text-sm hover:bg-indigo-100 transition-colors"
                                        data-category="learning" data-label="집중력좋음" data-warning="">집중력좋음</button>
                                </div>
                            </div>

                            <!-- 생활습관 카테고리 -->
                            <div class="mb-4">
                                <h4 class="text-sm font-medium text-slate-500 mb-2">생활습관</h4>
                                <div class="flex flex-wrap gap-2" id="tag-group-behavior">
                                    <button
                                        class="tag-btn px-3 py-1 border border-green-200 bg-green-50 text-green-700 rounded-full text-sm hover:bg-green-100 transition-colors"
                                        data-category="behavior" data-label="정리정돈수행" data-warning="">정리정돈수행</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-amber-200 bg-amber-50 text-amber-700 rounded-full text-sm hover:bg-amber-100 transition-colors"
                                        data-category="behavior" data-label="산만함" data-warning="caution">산만함</button>
                                    <button
                                        class="tag-btn px-3 py-1 border border-red-200 bg-red-50 text-red-700 rounded-full text-sm hover:bg-red-100 transition-colors"
                                        data-category="behavior" data-label="규칙위반" data-warning="alert">규칙위반</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 버튼 영역 -->

    <!-- 스크립트 분리: 앱 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, getDocs, addDoc, updateDoc, doc, setDoc, getDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCr_D0Qk-o6-Hw42YZmYpXZiDViuD-No1k",
            authDomain: "teacher-log-teaju-2026.firebaseapp.com",
            projectId: "teacher-log-teaju-2026",
            storageBucket: "teacher-log-teaju-2026.firebasestorage.app",
            messagingSenderId: "229156278607",
            appId: "1:229156278607:web:90a74203272532a997753a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.auth = auth;
        window.db = db;

        let currentUser = null;

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const btnLoginMain = document.getElementById('btn-login-main');
        const headerAuthSection = document.getElementById('header-auth-section');

        // ==== 인증 상태 모니터링 ====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // 로그인 성공 시
                currentUser = user;
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');

                // 상단 헤더 UI 업데이트
                headerAuthSection.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-medium text-slate-700">${user.displayName} 선생님</span>
                        <button id="btn-logout" class="text-sm text-slate-500 hover:text-slate-700 transition-colors">로그아웃</button>
                    </div>
                `;
                document.getElementById('btn-logout').addEventListener('click', () => {
                    signOut(auth);
                });

                // users 컬렉션에 사용자 정보 저장(없을 경우)
                try {
                    const userRef = doc(db, 'users', user.uid);
                    const userSnap = await getDoc(userRef);
                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            email: user.email,
                            name: user.displayName,
                            school: "",
                            createdAt: serverTimestamp()
                        });
                    }
                } catch (error) {
                    console.error("사용자 정보 저장/조회 실패:", error);
                }

                loadInitialData();
            } else {
                // 로그아웃 상태
                currentUser = null;
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
                headerAuthSection.innerHTML = '';
            }
        });

        // ==== 구글 로그인 ====
        btnLoginMain.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    console.error("로그인 실패:", error);
                    alert("로그인에 실패했습니다. 다시 시도해주세요.");
                }
            }
        });

        // 전역 상태 변수
        let currentClassId = null;
        let studentsData = [];
        let tagsData = [];
        let obsData = [];

        // ==== 초기 데이터 로드 ====
        async function loadInitialData() {
            try {
                // 1. 학급 조회
                const classesQ = query(collection(db, 'classes'), where('teacherId', '==', currentUser.uid));
                const classSnap = await getDocs(classesQ);

                if (classSnap.empty) {
                    await setupMockData();
                } else {
                    currentClassId = classSnap.docs[0].id;
                }

                // 2. 학생, 태그, 관찰 기록 조회
                const studentsQ = query(collection(db, 'students'), where('classId', '==', currentClassId), orderBy('number', 'asc'));

                const [studentsSnap, tagsSnap, obsSnap] = await Promise.all([
                    getDocs(studentsQ),
                    // 태그와 관찰 기록도 classId를 기준으로 가져오는 것이 이상적이지만, 
                    // 현재는 데모/MVP 목적으로 전체를 가져와서 필터링 (향후 인덱스 및 구조 개선 필요)
                    getDocs(collection(db, 'tags')),
                    getDocs(collection(db, 'observations'))
                ]);

                studentsData = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                // 본인 학급의 학생 데이터와 관련된 태그, 관찰 기록만 메모리에서 필터링
                const studentIds = studentsData.map(s => s.id);
                tagsData = tagsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => studentIds.includes(t.studentId));
                obsData = obsSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => studentIds.includes(o.studentId));

                renderStudentGrid();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('student-grid').innerHTML = '<div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-10 text-red-500">데이터를 불러오는 데 실패했습니다.</div>';
            }
        }

        async function setupMockData() {
            console.log("학급 데이터가 없어 모의 데이터를 생성합니다...");
            const classRef = await addDoc(collection(db, 'classes'), {
                teacherId: currentUser.uid,
                year: new Date().getFullYear(),
                grade: 1,
                classNumber: 1,
                studentCount: 3,
                createdAt: serverTimestamp()
            });
            currentClassId = classRef.id;

            const mockStudents = [
                { name: "김철수", number: 1, gender: "남", initialCheckCompleted: false },
                { name: "박민수", number: 2, gender: "남", initialCheckCompleted: true },
                { name: "이영희", number: 3, gender: "여", initialCheckCompleted: false }
            ];

            for (const st of mockStudents) {
                await addDoc(collection(db, 'students'), {
                    classId: currentClassId,
                    name: st.name,
                    number: st.number,
                    gender: st.gender,
                    initialCheckCompleted: st.initialCheckCompleted,
                    createdAt: serverTimestamp()
                });
            }
            console.log("모의 데이터 생성 완료");
        }

        // ==== 모달 UI 상태 제어 ====
        const modalBackdrop = document.getElementById('modal-backdrop');
        const tagModal = document.getElementById('tag-modal');
        const memoModal = document.getElementById('memo-modal');
        let selectedTags = [];

        window.openTagModal = function (studentId) {
            const student = studentsData.find(s => s.id === studentId);
            if (!student) return;

            document.getElementById('tag-target-student-id').value = studentId;
            document.getElementById('tag-modal-title').textContent = `${student.name} 학생 태그 찍기`;

            // 태그 선택 초기화
            selectedTags = [];
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'ring-primary');
            });

            modalBackdrop.classList.remove('hidden');
            tagModal.classList.remove('hidden');
        };

        window.closeTagModal = function () {
            modalBackdrop.classList.add('hidden');
            tagModal.classList.add('hidden');
        };

        window.openMemoModal = function (studentId) {
            const student = studentsData.find(s => s.id === studentId);
            if (!student) return;

            document.getElementById('memo-target-student-id').value = studentId;
            document.getElementById('memo-modal-title').textContent = `${student.name} 학생 관찰 메모하기`;
            document.getElementById('memo-textarea').value = '';

            modalBackdrop.classList.remove('hidden');
            memoModal.classList.remove('hidden');
        };

        window.closeMemoModal = function () {
            modalBackdrop.classList.add('hidden');
            memoModal.classList.add('hidden');
        };

        const initialCheckModal = document.getElementById('initial-check-modal');
        let uncompletedStudents = [];
        let currentIcIndex = 0;

        window.openInitialCheckModal = function () {
            // 미완료 학생 필터링
            uncompletedStudents = studentsData.filter(s => !s.initialCheckCompleted).sort((a, b) => a.number - b.number);

            if (uncompletedStudents.length === 0) {
                document.getElementById('ic-student-form-wrap').classList.add('hidden');
                document.getElementById('btn-save-next-ic').classList.add('hidden');
                document.getElementById('ic-no-more-students').classList.remove('hidden');
            } else {
                currentIcIndex = 0;
                document.getElementById('ic-student-form-wrap').classList.remove('hidden');
                document.getElementById('btn-save-next-ic').classList.remove('hidden');
                document.getElementById('ic-no-more-students').classList.add('hidden');
                renderInitialCheckForm();
            }

            modalBackdrop.classList.remove('hidden');
            initialCheckModal.classList.remove('hidden');
        };

        window.closeInitialCheckModal = function () {
            modalBackdrop.classList.add('hidden');
            initialCheckModal.classList.add('hidden');
        };

        function renderInitialCheckForm() {
            if (currentIcIndex >= uncompletedStudents.length || uncompletedStudents.length === 0) {
                closeInitialCheckModal();
                alert('모든 학생의 학기 초 성향 체크를 완료했습니다!');
                return;
            }

            const student = uncompletedStudents[currentIcIndex];
            document.getElementById('ic-student-id').value = student.id;
            document.getElementById('ic-number').textContent = student.number;
            document.getElementById('ic-name').textContent = student.name;
            document.getElementById('ic-gender').textContent = student.gender;

            // 폼 초기화
            document.querySelectorAll('.ic-check').forEach(chk => chk.checked = false);
            document.getElementById('ic-memo').value = '';

            document.getElementById('ic-progress').textContent = `남은 대상: ${uncompletedStudents.length - currentIcIndex}명`;
        }

        document.getElementById('btn-save-next-ic').addEventListener('click', async () => {
            const studentId = document.getElementById('ic-student-id').value;
            if (!studentId) return;

            const btnSaveNext = document.getElementById('btn-save-next-ic');
            btnSaveNext.disabled = true;
            btnSaveNext.textContent = '저장 중...';

            const checkboxes = document.querySelectorAll('.ic-check:checked');
            const traits = Array.from(checkboxes).map(c => c.value);
            const memoContent = document.getElementById('ic-memo').value.trim();

            try {
                // 1. initialChecks 컬렉션 데이터 저장
                const mockLocalTimestamp = { toMillis: () => Date.now() };
                const newCheckData = {
                    classId: currentClassId,
                    studentId: studentId,
                    traits: traits,
                    memo: memoContent,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, 'initialChecks'), newCheckData);

                // 2. students 컬렉션 업데이트 (initialCheckCompleted = true)
                const studentRef = doc(db, 'students', studentId);
                await updateDoc(studentRef, {
                    initialCheckCompleted: true,
                    updatedAt: serverTimestamp()
                });

                // 로컬 상태 동기화
                const stuNode = studentsData.find(s => s.id === studentId);
                if (stuNode) {
                    stuNode.initialCheckCompleted = true;
                }

                currentIcIndex++;
                renderStudentGrid(); // UI(특히 V 체크마크) 갱신
                renderInitialCheckForm(); // 다음 학생 렌더링
            } catch (error) {
                console.error("학기 초 성향 체크 저장 오류:", error);
                alert("데이터 저장 중 오류가 발생했습니다.");
            } finally {
                btnSaveNext.disabled = false;
                btnSaveNext.textContent = '저장 후 계속';
            }
        });

        // ==== 태그 버튼 선택 이벤트 ====
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                const tagData = {
                    category: target.dataset.category,
                    label: target.dataset.label,
                    warningLevel: target.dataset.warning
                };

                const index = selectedTags.findIndex(t => t.label === tagData.label);
                if (index > -1) {
                    selectedTags.splice(index, 1);
                    target.classList.remove('ring-2', 'ring-offset-2', 'ring-primary');
                } else {
                    selectedTags.push(tagData);
                    target.classList.add('ring-2', 'ring-offset-2', 'ring-primary');
                }
            });
        });

        // ==== 메모 템플릿 버튼 이벤트 ====
        document.querySelectorAll('.memo-template-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const textarea = document.getElementById('memo-textarea');
                const textToAdd = e.currentTarget.dataset.text;
                textarea.value = (textarea.value + ' ' + textToAdd).trim();
            });
        });

        // ==== 저장 로직: 태그 ====
        document.getElementById('btn-save-tag').addEventListener('click', async () => {
            const studentId = document.getElementById('tag-target-student-id').value;
            if (selectedTags.length === 0) {
                alert('태그를 선택해주세요.');
                return;
            }

            try {
                for (const t of selectedTags) {
                    // 동일 라벨이 있는지 확인
                    const existingTag = tagsData.find(tag => tag.studentId === studentId && tag.label === t.label);

                    if (existingTag) {
                        const tagRef = doc(db, 'tags', existingTag.id);
                        await updateDoc(tagRef, {
                            count: increment(1),
                            updatedAt: serverTimestamp()
                        });
                        existingTag.count += 1; // 로컬 상태 업데이트
                    } else {
                        const newTag = {
                            classId: currentClassId,
                            studentId: studentId,
                            category: t.category,
                            label: t.label,
                            warningLevel: t.warningLevel || null,
                            count: 1,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        };
                        const docRef = await addDoc(collection(db, 'tags'), newTag);
                        tagsData.push({ id: docRef.id, ...newTag }); // 로컬 상태 업데이트
                    }
                }

                closeTagModal();
                renderStudentGrid(); // UI 갱신
            } catch (error) {
                console.error("태그 저장 실패:", error);
                alert("저장 중 오류가 발생했습니다.");
            }
        });

        // ==== 저장 로직: 메모 ====
        document.getElementById('btn-save-memo').addEventListener('click', async () => {
            const studentId = document.getElementById('memo-target-student-id').value;
            const content = document.getElementById('memo-textarea').value.trim();

            if (!content) {
                alert('메모 내용을 입력해주세요.');
                return;
            }

            try {
                // 임의로 로컬 시간을 createdAt으로 사용하여 렌더링 즉각 반영 (서버타임스탬프 대체)
                const mockLocalTimestamp = { toMillis: () => Date.now() };
                const newMemo = {
                    classId: currentClassId,
                    studentId: studentId,
                    content: content,
                    createdAt: serverTimestamp() // DB 저장용
                };

                const docRef = await addDoc(collection(db, 'observations'), newMemo);

                // 로컬 렌더링을 위해 임시 타임스탬프 주입
                obsData.push({ id: docRef.id, ...newMemo, createdAt: mockLocalTimestamp });

                closeMemoModal();
                renderStudentGrid(); // UI 갱신
            } catch (error) {
                console.error("메모 저장 실패:", error);
                alert("저장 중 오류가 발생했습니다.");
            }
        });

        function renderStudentGrid() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';

            if (studentsData.length === 0) {
                grid.innerHTML = `<div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-10 text-slate-500">등록된 학생이 없습니다.</div>`;
                return;
            }

            studentsData.forEach(student => {
                const stTags = tagsData.filter(t => t.studentId === student.id);
                const warningCount = stTags.filter(t => t.warningLevel === 'caution' || t.warningLevel === 'alert').reduce((sum, t) => sum + t.count, 0);

                // 시간 역순 (createdAt이 없거나 pending 상태 처리 방어 로직)
                const stObs = obsData.filter(o => o.studentId === student.id)
                    .sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : Date.now();
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : Date.now();
                        return timeB - timeA;
                    });

                const recentObs = stObs.length > 0 ? stObs[0].content : "관찰 기록이 없습니다.";

                const tagsHtml = stTags.map(tag => {
                    let bg = "bg-slate-50", text = "text-slate-700";
                    if (tag.category === 'personality') { bg = "bg-sky-50"; text = "text-sky-700"; }
                    else if (tag.category === 'learning') { bg = "bg-indigo-50"; text = "text-indigo-700"; }
                    else if (tag.category === 'behavior' && !tag.warningLevel) { bg = "bg-green-50"; text = "text-green-700"; }
                    else if (tag.warningLevel === 'caution') { bg = "bg-amber-50"; text = "text-amber-700"; }
                    else if (tag.warningLevel === 'alert') { bg = "bg-red-50"; text = "text-red-700"; }
                    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${bg} ${text}">${tag.label} ${tag.count > 1 ? tag.count : ''}</span>`;
                }).join('');

                const bgGender = student.gender === '남' ? 'bg-sky-100 text-sky-700' : 'bg-rose-100 text-rose-700';

                const cardHtml = `
                    <div class="bg-white overflow-hidden shadow-sm rounded-lg border border-slate-200 hover:shadow-md hover:-translate-y-1 transition-all duration-200">
                        <div class="px-4 py-5 sm:p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center">
                                    <div class="flex-shrink-0 h-10 w-10 rounded-full ${bgGender} flex items-center justify-center font-bold text-lg">
                                        ${student.number}
                                    </div>
                                    <div class="ml-4">
                                        <h3 class="text-lg leading-6 font-medium text-slate-900">${student.name} <span class="text-sm text-slate-500 font-normal ml-1">${student.gender}</span></h3>
                                    </div>
                                </div>
                                ${warningCount >= 3 ? `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded-full font-medium">주의필요 ${warningCount}</span>` : ''}
                            </div>
                            <div class="flex flex-wrap gap-1 mb-4 h-12 overflow-hidden content-start">
                                ${tagsHtml}
                            </div>
                            <div class="text-sm text-slate-600 line-clamp-2 bg-slate-50 p-3 rounded border border-slate-100 italic h-16">
                                ${recentObs}
                            </div>
                        </div>
                        <div class="bg-slate-50 px-4 py-3 sm:px-6 flex justify-between border-t border-slate-200">
                            <button class="text-sm font-medium text-primary hover:text-primary-hover btn-ripple flex items-center" onclick="openTagModal('${student.id}')">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                                태그찍기
                            </button>
                            <button class="text-sm font-medium text-primary hover:text-primary-hover btn-ripple flex items-center" onclick="openMemoModal('${student.id}')">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                메모
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }
    </script>
</body>

</html>
