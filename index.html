<!DOCTYPE html>

<body class="bg-background relative w-full h-full min-h-screen overflow-x-hidden">

          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 w-full bg-surface border-t border-borderDiv flex justify-around items-center h-16 z-20 pb-safe">
      <div id="nav-home" class="flex flex-col items-center justify-center text-primary w-full h-full cursor-pointer transition-colors active:bg-gray-50">

        <span class="text-[11px] mt-1 font-medium">통계 조회</span>

  <!-- ============================================== -->
  <!-- 2. Bottom Sheet Modal (Scenario A)               -->
  <!-- ============================================== -->
  <div id="backdrop" class="fixed inset-0 bg-black/40 z-30 transition-opacity duration-300 opacity-0 pointer-events-none"></div>

  <div id="bottom-sheet" class="fixed inset-x-0 bottom-0 bg-surface rounded-t-2xl shadow-xl z-40 transform translate-y-full transition-transform duration-300 flex flex-col max-h-[85vh]">
    <div class="px-5 py-4 border-b border-borderDiv flex justify-between items-center bg-surface rounded-t-2xl sticky top-0">
      <h2 id="bs-student-name" class="text-xl font-bold text-textPrimary">학생 태그 추가</h2>

    <div class="p-5 flex-1 overflow-y-auto">

          </div>
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-borderDiv bg-surface pb-safe">
      <button id="btn-save-bs" class="w-full h-14 bg-primary text-white font-medium text-lg rounded-lg shadow active:scale-[0.98] transition-transform flex items-center justify-center">
        저장

    </div>
  </div>

  <!-- ============================================== -->
  <!-- 3. Wizard Modal (Scenario B)                     -->
  <!-- ============================================== -->
  <div id="wizard-modal" class="fixed inset-0 bg-surface z-50 transform translate-y-full transition-transform duration-300 pointer-events-none flex flex-col">
    <!-- Wizard Header -->
    <div class="px-3 py-3 border-b border-borderDiv bg-surface flex items-center pt-safe shadow-sm">
      <button id="btn-close-wizard" class="p-2 text-textSecondary active:bg-gray-100 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>

      <div class="flex-1 mx-4 relative">
        <div class="h-2 bg-gray-100 border border-gray-200 rounded-full overflow-hidden">
          <div id="wizard-progress" class="h-full bg-primary transition-all duration-300 relative" style="width: 0%">
             <div class="absolute right-0 top-0 bottom-0 w-5 bg-white opacity-20"></div>
          </div>
        </div>
      </div>
      <span id="wizard-counter" class="text-xs font-semibold text-textSecondary min-w-[32px] text-right">0/0</span>
    </div>
    
    <!-- Wizard Body -->
    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center overflow-hidden relative">
       <!-- Background decoration element -->
       <div class="absolute opacity-5 -top-10 -right-10 w-64 h-64 bg-primary rounded-full filter blur-3xl pointer-events-none"></div>

      <div class="bg-gray-50 border border-dashed border-gray-300 text-gray-500 rounded-lg px-3 py-1 text-xs font-medium mb-4">

      <h1 id="wizard-student-name" class="text-[40px] font-extrabold text-textPrimary tracking-tight mb-8">안지정</h1>
      
      <!-- Quick Tags for Wizard -->
      <div class="grid grid-cols-2 gap-4 w-full max-w-[340px]">
        <button class="wizard-btn-tag py-6 flex flex-col items-center justify-center bg-white shadow border border-gray-100 rounded-2xl active:bg-indigo-50 active:scale-[0.98] transition-all" data-tag="t2" aria-label="집중 우수">
           <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-2 shadow-inner">
             <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
           </div>
           <span class="text-base font-bold text-gray-800">집중 우수</span>
        </button>
        <button class="wizard-btn-tag py-6 flex flex-col items-center justify-center bg-white shadow border border-gray-100 rounded-2xl active:bg-amber-50 active:scale-[0.98] transition-all" data-tag="t4" aria-label="산만함">
           <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-2 shadow-inner">
             <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
           </div>
           <span class="text-base font-bold text-gray-800">산만함</span>
        </button>
        <button class="wizard-btn-tag py-4 flex flex-col justify-center items-center bg-white shadow border border-gray-100 rounded-2xl active:bg-sky-50 active:scale-[0.98] transition-all col-span-2" data-tag="t1">
           <div class="flex items-center text-sky-600 gap-2">
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
             <span class="text-base font-bold text-gray-800">특이사항 없음 (외향/밝음)</span>

        </button>
      </div>
    </div>
    
    <div class="p-6 pb-safe bg-surface flex justify-center sticky bottom-0">
      <button id="btn-wizard-skip" class="w-full max-w-[340px] h-14 border border-gray-300 text-gray-600 font-medium active:bg-gray-100 transition-colors rounded-xl flex items-center justify-center relative shadow-sm">
        <span class="absolute left-6">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>
        지금은 평가 건너뛰기
      </button>
    </div>
  </div>

  <!-- Toast Message Box -->
  <div id="toast-container" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

  <!-- ============================================== -->
  <!-- Firebase & Application Logic                   -->
  <!-- ============================================== -->
  <!-- Google Identity Services (GIS) API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script type="module">
    //==========================================
    // 1. Firebase Initializing
    //==========================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, runTransaction, serverTimestamp, query, where, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Firebase 웹 앱 설정 (선생님 발급 키 적용 완료)
    const firebaseConfig = {
      apiKey: "AIzaSyCr_D0Qk-o6-Hw42YZmYpXZiDViuD-No1k",
      authDomain: "teacher-log-teaju-2026.firebaseapp.com",
      projectId: "teacher-log-teaju-2026",
      storageBucket: "teacher-log-teaju-2026.firebasestorage.app",
      messagingSenderId: "229156278607",
      appId: "1:229156278607:web:90a74203272532a997753a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    //==========================================
    // 2. Global State & Data Definitions
    //==========================================
    const state = {
      user: null,
      students: [], // db mock
      activeStudentId: null,
      selectedTags: new Set(),
      // Wizard Properties
      wizardQueue: [],
      wizardCurrentIndex: 0,
    };

    const TAG_CATEGORIES = {
      '긍정': { bg: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-300' },
      '학습': { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-300' },
      '생활': { bg: 'bg-green-50', text: 'text-green-700', border: 'border-green-300' },
      '주의': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-300' },
      '경고': { bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-300' },
    };

    const TAGS = [
      { id: 't1', label: '외향적', cat: '긍정' },
      { id: 't2', label: '집중 우수', cat: '학습' },
      { id: 't3', label: '정리 정돈 잘함', cat: '생활' },
      { id: 't4', label: '산만함', cat: '주의' },
      { id: 't5', label: '지각', cat: '주의' },
      { id: 't6', label: '친구와 갈등', cat: '경고' },
    ];

    //==========================================
    // 3. View Logic & DOM Bindings
    //==========================================
    const DOM = {
      login: document.getElementById('login-view'),
      app: document.getElementById('app-view'),
      btnLogout: document.getElementById('btn-logout-trigger'),
      grid: document.getElementById('student-grid'),
      toast: document.getElementById('toast-container'),
      avatarInit: document.getElementById('user-avatar-initial'),
      googleBtnContainer: document.getElementById('google-btn-container'),
      
      // Navigation Tabs
      navHome: document.getElementById('nav-home'),
      navStats: document.getElementById('nav-stats'),
      homeTab: document.getElementById('home-tab'),
      statsTab: document.getElementById('stats-tab'),
      
      // Bottom Sheet DOMs
      backdrop: document.getElementById('backdrop'),
      bottomSheet: document.getElementById('bottom-sheet'),
      bsStudentName: document.getElementById('bs-student-name'),
      btnCloseBs: document.getElementById('btn-close-bs'),
      btnSaveBs: document.getElementById('btn-save-bs'),
      chipContainer: document.getElementById('chip-container'),
      btnToggleMemo: document.getElementById('btn-toggle-memo'),
      memoContainer: document.getElementById('memo-container'),
      memoInput: document.getElementById('memo-input'),
      
      // Wizard DOMs
      btnFabWizard: document.getElementById('btn-fab-wizard'),
      wizardModal: document.getElementById('wizard-modal'),
      btnCloseWizard: document.getElementById('btn-close-wizard'),
      wizardProgress: document.getElementById('wizard-progress'),
      wizardCounter: document.getElementById('wizard-counter'),
      wizardStudentName: document.getElementById('wizard-student-name'),
      btnWizardSkip: document.getElementById('btn-wizard-skip'),
      classChart: document.getElementById('class-chart') ? document.getElementById('class-chart').getContext('2d') : null,
      warningList: document.getElementById('warning-list'),
    };

    const showToast = (message, type = 'success') => {
      const el = document.createElement('div');
      const isError = type === 'error';
      el.className = `px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white transition-opacity duration-300 ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
      el.textContent = message;
      DOM.toast.appendChild(el);
      
      setTimeout(() => { el.style.opacity = '0'; }, 2000);
      setTimeout(() => { if(el.parentNode) el.remove(); }, 2300);
    };

    const toggleView = (isLoggedIn) => {
      if(isLoggedIn) {
        DOM.login.classList.add('hide');
        DOM.app.classList.remove('hide');
      } else {
        DOM.login.classList.remove('hide');
        DOM.app.classList.add('hide');
      }
    };

    const renderStudents = () => {
      DOM.grid.innerHTML = state.students.map(s => `
        <div class="bg-white border border-borderDiv rounded-lg p-4 shadow-sm flex flex-col items-center relative transition-transform">
          <div class="text-lg font-semibold text-textPrimary">${s.name}</div>
          <div class="text-xs text-textSecondary mt-1">${s.studentNo}번</div>
          ${s.warningTagCount > 0 ? `<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-100 text-red-600 text-[10px] font-bold flex items-center justify-center border border-white font-sans">${s.warningTagCount}</div>` : ''}
          <button class="mt-4 w-full py-2 px-3 bg-gray-50 border border-borderDiv rounded-lg text-sm font-medium text-textSecondary active:bg-gray-100 transition-colors btn-open-bs" data-id="${s.id}" data-name="${s.name}">
            태그 찍기
          </button>
        </div>
      `).join('');
      
      // Bottom Sheet 트리거 이벤트 바인딩
      document.querySelectorAll('.btn-open-bs').forEach(btn => {
        btn.addEventListener('click', (e) => {
          openBottomSheet(e.currentTarget.dataset.id, e.currentTarget.dataset.name);
        });
      });
    };

    //==========================================
    // 3.1 Bottom Sheet Logic (Scenario A)
    //==========================================
    const renderChips = () => {
      DOM.chipContainer.innerHTML = TAGS.map(tag => {
        const isSelected = state.selectedTags.has(tag.id);
        const color = TAG_CATEGORIES[tag.cat];
        // 48px 이상 터치 영역 및 상태별 컬러 분기 (선택 시 굵고 진하게)
        const classStr = isSelected 
          ? `${color.bg} ${color.text} ${color.border} active:scale-95 border-2 min-h-[48px] font-semibold opacity-100 shadow-sm` 
          : `bg-white text-slate-600 border-slate-300 active:bg-slate-50 active:scale-95 min-h-[48px] font-medium opacity-90 border border-dashed`;

        return `<button class="chip px-4 py-2 rounded-full flex justify-center items-center transition-all ${classStr}" data-id="${tag.id}">
            ${tag.label}
          </button>`;
      }).join('');

      // 칩 토글 이벤트 바인딩
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          state.selectedTags.has(id) ? state.selectedTags.delete(id) : state.selectedTags.add(id);
          renderChips(); // 낙관적 칩 렌더링
        });
      });
    };

    const openBottomSheet = (studentId, studentName) => {
      state.activeStudentId = studentId;
      state.selectedTags.clear();
      DOM.bsStudentName.textContent = `${studentName} 관찰 추가`;
      DOM.memoInput.value = '';
      DOM.memoContainer.classList.add('hide'); // 메모 닫아둠 (점진적 공개)
      
      renderChips(); // 렌더링 초기화
      
      // 슬라이딩 애니메이션 실행
      DOM.backdrop.classList.remove('pointer-events-none', 'opacity-0');
      DOM.backdrop.classList.add('opacity-100');
      DOM.bottomSheet.classList.remove('translate-y-full');
      DOM.bottomSheet.classList.add('translate-y-0');
    };

    const closeBottomSheet = () => {
      state.activeStudentId = null;
      DOM.backdrop.classList.add('pointer-events-none', 'opacity-0');
      DOM.backdrop.classList.remove('opacity-100');
      DOM.bottomSheet.classList.add('translate-y-full');
      DOM.bottomSheet.classList.remove('translate-y-0');
    };

    // Bottom Sheet Event Listeners
    DOM.btnCloseBs.addEventListener('click', closeBottomSheet);
    DOM.backdrop.addEventListener('click', closeBottomSheet);
    
    // 메모 아코디언 토글
    DOM.btnToggleMemo.addEventListener('click', () => {
      DOM.memoContainer.classList.toggle('hide');
    });

    // 상용구 칩 클릭 시 Textarea에 자동 삽입
    document.querySelectorAll('.preset-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const text = e.currentTarget.textContent;
        // 문장 이어붙이기
        DOM.memoInput.value += (DOM.memoInput.value ? " " : "") + text;
      });
    });

    //==========================================
    // 3.2 낙관적 UI 업데이트 및 롤백 로직 (Save)
    //==========================================
    DOM.btnSaveBs.addEventListener('click', async () => {
      if(state.selectedTags.size === 0 && DOM.memoInput.value.trim() === '') {
        showToast('최소 1개의 태그 또는 메모를 작성해 주세요.', 'error');
        return;
      }
      
      const stIndex = state.students.findIndex(s => s.id === state.activeStudentId);
      if(stIndex === -1) return;

      // 1. Rollback용 데이터 백업 깊은 복사
      const prevStudentState = JSON.parse(JSON.stringify(state.students[stIndex]));
      
      // 태그 연산
      let warningDelta = 0; let positiveDelta = 0;
      Array.from(state.selectedTags).forEach(id => {
        const t = TAGS.find(x => x.id === id);
        if(t.cat === '주의' || t.cat === '경고') warningDelta++;
        if(t.cat === '긍정' || t.cat === '학습' || t.cat === '생활') positiveDelta++;
      });

      // 2. Optimistic UI 선 반영 및 뷰 새로고침
      state.students[stIndex].warningTagCount += warningDelta;
      state.students[stIndex].positiveTagCount += positiveDelta;
      
      renderStudents();        // 화면 즉시 리렌더링
      closeBottomSheet();      // 체감 지연 0초
      showToast('성공적으로 저장되었습니다.'); 

      // 3. 백그라운드 서버 전송 (실패 시 롤백 수행)
      try {
        // 실제 관찰 기록 추가 및 역정규화 카운트 트랜잭션 업데이트
        const obsRef = collection(db, 'observations');
        await addDoc(obsRef, {
          teacherUid: state.user.uid,
          studentId: state.activeStudentId,
          tags: Array.from(state.selectedTags),
          memo: DOM.memoInput.value.trim(),
          createdAt: serverTimestamp()
        });
        
        const stRef = doc(db, 'students', state.activeStudentId);
        await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(stRef);
          if(!docSnap.exists()) throw new Error("데이터 없음");
          transaction.update(stRef, { 
            warningTagCount: docSnap.data().warningTagCount + warningDelta, 
            positiveTagCount: docSnap.data().positiveTagCount + positiveDelta 
          });
        });
      } catch (error) {
        // 에러 감지 -> 롤백 실행
        console.error("Firebase Update Failed:", error);
        state.students[stIndex] = prevStudentState; // 상태 원복
        renderStudents(); // 강제 롤백 재렌더링
        showToast('네트워크 오류입니다. 로컬 기록이 취소되었습니다.', 'error');
      }
    });

    //==========================================
    // 3.3 통계 조회 뷰 라우팅 로직 (Scenario C)
    //==========================================
    let classChartInstance = null;

    const renderStats = () => {
      // 1. 요주의 학생 명단 업데이트
      const warnings = state.students.filter(s => s.warningTagCount > 0).sort((a,b) => b.warningTagCount - a.warningTagCount);
      DOM.warningList.innerHTML = warnings.length > 0
        ? warnings.map(s => `
          <li class="py-3 flex justify-between items-center transition-colors">
            <span class="font-medium text-textPrimary">${s.name} <span class="text-xs text-textSecondary ml-1">${s.studentNo}번</span></span> 
            <span class="bg-red-50 text-red-600 text-xs px-2 py-1 rounded-full font-bold border border-red-100 flex items-center">
              ${s.warningTagCount}회 누적
              <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </span>
          </li>`).join('')
        : `<li class="py-10 text-center text-sm text-textSecondary font-medium flex flex-col items-center">
             <svg class="w-10 h-10 mb-2 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
             현재 요주의 상담 대상 학생이 없습니다.
           </li>`;

      // 2. Chart.js 캔버스 렌더링
      if(classChartInstance) classChartInstance.destroy();
      if(!DOM.classChart || typeof Chart === 'undefined') return;

      const posTotal = state.students.reduce((acc, s) => acc + s.positiveTagCount, 0);
      const negTotal = state.students.reduce((acc, s) => acc + s.warningTagCount, 0);
      
      // 피드백 데이터가 전혀 없을 경우 더미 플레이스홀더 출력 처리
      const hasData = posTotal > 0 || negTotal > 0;

      classChartInstance = new Chart(DOM.classChart, {
        type: 'doughnut',
        data: {
          labels: ['긍정/학습 (+)', '주의/경고 (-)'],
          datasets: [{
            data: hasData ? [posTotal, negTotal] : [1, 1], // 빈 깡통 레이아웃
            backgroundColor: hasData ? ['#059669', '#EF4444'] : ['#E2E8F0', '#E2E8F0'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { family: "'Noto Sans KR', sans-serif" } } }
          }
        }
      });
    };

    DOM.navHome.addEventListener('click', () => {
       DOM.homeTab.classList.remove('hide');
       DOM.statsTab.classList.add('hide');
       DOM.navHome.classList.replace('text-textSecondary', 'text-primary');
       DOM.navStats.classList.replace('text-primary', 'text-textSecondary');
    });

    DOM.navStats.addEventListener('click', () => {
       DOM.homeTab.classList.add('hide');
       DOM.statsTab.classList.remove('hide');
       DOM.navStats.classList.replace('text-textSecondary', 'text-primary');
       DOM.navHome.classList.replace('text-primary', 'text-textSecondary');
       renderStats(); // 탭 이동 시 렌더링
    });

    //==========================================
    // 3.4 마법사 뷰 (Scenario B)
    //==========================================
    const renderWizardStep = () => {
      const queue = state.wizardQueue;
      const currentIdx = state.wizardCurrentIndex;
      
      if(currentIdx >= queue.length) {
        closeWizard();
        showToast(`총 ${queue.length}명의 관찰 일지 검토가 완료되었습니다 🎉`);
        renderStudents();
        return;
      }
      
      const st = queue[currentIdx];
      DOM.wizardStudentName.textContent = st.name;
      DOM.wizardCounter.textContent = `${currentIdx + 1}/${queue.length}`;
      DOM.wizardProgress.style.width = `${((currentIdx + 1) / queue.length) * 100}%`;
    };

    const openWizard = () => {
      // 랜덤 5명 추출 (실제 앱에서는 당일 기록 없는 학생 우선 색인 로직 적용)
      state.wizardQueue = [...state.students].sort(() => 0.5 - Math.random()).slice(0, 5);
      state.wizardCurrentIndex = 0;
      
      if(state.wizardQueue.length === 0) {
        showToast('오늘은 더 이상 관찰을 갱신할 학생이 없습니다!');
        return;
      }
      
      DOM.wizardModal.classList.remove('translate-y-full', 'pointer-events-none');
      DOM.wizardModal.classList.add('translate-y-0');
      renderWizardStep();
    };

    const closeWizard = () => {
      DOM.wizardModal.classList.add('translate-y-full', 'pointer-events-none');
      DOM.wizardModal.classList.remove('translate-y-0');
    };

    DOM.btnFabWizard.addEventListener('click', openWizard);
    DOM.btnCloseWizard.addEventListener('click', closeWizard);
    
    // 건너뛰기 로직
    DOM.btnWizardSkip.addEventListener('click', () => {
        state.wizardCurrentIndex++;
        renderWizardStep();
    });

    // 마법사 태그 버튼 클릭 즉시 낙관적 저장 후 넥스트 스텝 수행
    document.querySelectorAll('.wizard-btn-tag').forEach(btn => {
       btn.addEventListener('click', async (e) => {
          const tagId = e.currentTarget.dataset.tag;
          const stId = state.wizardQueue[state.wizardCurrentIndex].id;
          const stIdx = state.students.findIndex(s => s.id === stId);
          if(stIdx === -1) return;
          
          const t = TAGS.find(x => x.id === tagId);
          
          // 낙관적 UI 즉시 반영
          if(t.cat === '경고' || t.cat === '주의') state.students[stIdx].warningTagCount++;
          else state.students[stIdx].positiveTagCount++;
          
          // 실제 Firebase 백그라운드 비동기 DB 갱신 API 호출 (await 대기 없는 무중단 갱신)
          const obsRef = collection(db, 'observations');
          addDoc(obsRef, {
            teacherUid: state.user.uid,
            studentId: stId,
            tags: [tagId],
            memo: '',
            createdAt: serverTimestamp()
          }).catch(console.error);

          const stRef = doc(db, 'students', stId);
          runTransaction(db, async (transaction) => {
            const docSnap = await transaction.get(stRef);
            if(!docSnap.exists()) return;
            const wDelta = (t.cat === '경고' || t.cat === '주의') ? 1 : 0;
            const pDelta = (t.cat === '긍정' || t.cat === '학습' || t.cat === '생활') ? 1 : 0;
            transaction.update(stRef, { 
              warningTagCount: docSnap.data().warningTagCount + wDelta, 
              positiveTagCount: docSnap.data().positiveTagCount + pDelta 
            });
          }).catch(console.error);
          
          // 다음 학생으로 시각적 턴 넘김
          state.wizardCurrentIndex++;
          renderWizardStep();
       });
    });

    //==========================================
    // 4. Firestore DB Fetching Logic
    //==========================================
    const fetchStudents = async () => {
      try {
        const q = query(collection(db, 'students'), where('teacherUid', '==', state.user.uid), orderBy('studentNo', 'asc'));
        const snapshot = await getDocs(q);
        
        if(snapshot.empty) {
           // 데이터가 아예 없는 교사의 최초 로그인인 경우, 더미 학생 명단 삽입하여 화면 제공 (온보딩)
           const dummy = [
             { name: '김철수', studentNo: 1, warningTagCount: 0, positiveTagCount: 0 },
             { name: '이영희', studentNo: 2, warningTagCount: 0, positiveTagCount: 0 },
             { name: '박지민', studentNo: 3, warningTagCount: 0, positiveTagCount: 0 },
             { name: '정민수', studentNo: 4, warningTagCount: 0, positiveTagCount: 0 },
             { name: '안지정', studentNo: 5, warningTagCount: 0, positiveTagCount: 0 },
             { name: '강유리', studentNo: 6, warningTagCount: 0, positiveTagCount: 0 }
           ];
           state.students = [];
           for(const d of dummy) {
             const ref = doc(collection(db, 'students'));
             const stData = { ...d, teacherUid: state.user.uid };
             await setDoc(ref, stData);
             state.students.push({ id: ref.id, ...stData });
           }
        } else {
           state.students = [];
           snapshot.forEach(docSnap => {
              state.students.push({ id: docSnap.id, ...docSnap.data() });
           });
        }
        renderStudents();
      } catch(error) {
         console.error('Data Load Error', error);
         showToast('데이터베이스 초기화 에러가 발생했습니다. (보안 규칙 또는 인증 오류)', 'error');
         // UI 마비 방지를 위한 폴백 더미 출력
         state.students = [{ id: 'err1', name: '에러 복구 모드', studentNo: 1, warningTagCount: 0, positiveTagCount: 0 }];
         renderStudents();
      }
    };

    //==========================================
    // 5. App Initialization & Auth Listener
    //==========================================
    
    // GIS (Google Identity Services) 콜백 및 렌더링
    window.handleCredentialResponse = async (response) => {
      try {
        // GIS에서 반환된 jwt(ID Token)를 Firebase Auth 자격 증명으로 변환
        const credential = GoogleAuthProvider.credential(response.credential);
        await signInWithCredential(auth, credential);
      } catch (error) {
        console.error("Login Failed", error);
        showToast('로그인에 실패했습니다.', 'error');
      }
    };

    window.onload = () => {
      if (typeof google === 'undefined') return;
      google.accounts.id.initialize({
        client_id: "229156278607-0ak7ia9t66evrac5mh4r70rr67sqcf5m.apps.googleusercontent.com",
        callback: window.handleCredentialResponse
      });
      google.accounts.id.renderButton(
        DOM.googleBtnContainer,
        { theme: "outline", size: "large", type: "standard", width: 280 }  
      );
    };

    DOM.btnLogout.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        state.user = user;
        DOM.avatarInit.textContent = user.displayName ? user.displayName.charAt(0) : 'T';
        toggleView(true);
        await fetchStudents(); 
        showToast('환영합니다 선생님!');
      } else {
        state.user = null;
        toggleView(false);
      }
    });

  </script>
</body>
</html>
